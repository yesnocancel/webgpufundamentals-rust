<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>WebGPU Textured Cube Map</title>
    <style>
      @import url(resources/webgpu-lesson.css);
html, body {
  margin: 0;       /* remove the default margin          */
  height: 100%;    /* make the html,body fill the page   */
}
canvas {
  display: block;  /* make the canvas act like a block   */
  width: 100%;     /* make the canvas fill its container */
  height: 100%;
}
    </style>
  </head>
  <body>
    <canvas></canvas>
  </body>
    <script type="module">
import GUI from '../3rdparty/muigui-0.x.module.js';
import init, * as wasm from './wasm/webgpu-cube-map/webgpu-cube-map.js';
await init();

const degToRad = d => d * Math.PI / 180;

const settings = {
  rotation: [degToRad(20), degToRad(25), degToRad(0)],
};

const radToDegOptions = { min: -360, max: 360, step: 1, converters: GUI.converters.radToDeg };

const gui = new GUI();
gui.add(settings.rotation, '0', radToDegOptions).name('rotation.x')
   .onChange(v => wasm.set_setting_num('rotationX', v));
gui.add(settings.rotation, '1', radToDegOptions).name('rotation.y')
   .onChange(v => wasm.set_setting_num('rotationY', v));
gui.add(settings.rotation, '2', radToDegOptions).name('rotation.z')
   .onChange(v => wasm.set_setting_num('rotationZ', v));
  </script>
</html>
