<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>WebGPU Textured Cube Map</title>
    <style>
      @import url(resources/webgpu-lesson.css);
canvas {
  margin-right: 5px;
}
    </style>
  </head>
  <body>
  </body>
    <script type="module">
// The JS version generates these faces with a 2D canvas. The Rust version
// of the cube-map example loads these pre-made images instead; this page
// just shows them.
const faces = ['pos-x', 'neg-x', 'pos-y', 'neg-y', 'pos-z', 'neg-z'];
for (const face of faces) {
  const img = document.createElement('img');
  img.src = `resources/images/cube-faces/${face}.png`;
  img.style.marginRight = '5px';
  document.body.appendChild(img);
}
  </script>
</html>
