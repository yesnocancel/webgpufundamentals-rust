<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>WebGPU Post Processing - Step 10 - 3D-LUTs with adobe LUT loader</title>
    <style>
      @import url(resources/webgpu-lesson.css);
html, body {
  margin: 0;       /* remove the default margin          */
  height: 100%;    /* make the html,body fill the page   */
}
canvas {
  display: block;  /* make the canvas act like a block   */
  width: 100%;     /* make the canvas fill its container */
  height: 100%;
}
    </style>
  </head>
  <body>
    <canvas></canvas>
  </body>
    <script type="module">
import GUI from '../3rdparty/muigui-0.x.module.js';
import init, * as wasm from './wasm/webgpu-post-processing-image-adjustments-3d-luts-w-loader/webgpu-post-processing-image-adjustments-3d-luts-w-loader.js';
await init();

// must match the lut_bind_groups order in the Rust example
const lutNames = [
  'identity',
  'identity (nearest)',
  'monochrome',
  'sepia',
  'saturated',
  'posterize',
  'posterize-3-rgb',
  'posterize-3-lab',
  'posterize-4-lab',
  'posterize-more',
  'inverse',
  'color negative',
  'funky contrast',
  'nightvision',
  'thermal',
  'b/w',
  'hue +60',
  'hue +180',
  'hue -60',
  'red to cyan',
  'blues',
  'infrared',
  'radioactive',
  'goolgey',
  'bgy',
];

const settings = {
  amount: 1,
  lut: 0,
};

const gui = new GUI();
gui.name('Choose LUT');
gui.add(settings, 'amount', 0, 1)
   .onChange(v => wasm.set_setting_num('amount', v));
const keyValues = Object.fromEntries(lutNames.map((name, i) => [name, i]));
gui.add(settings, 'lut', { keyValues })
   .onChange(v => wasm.set_setting_num('lut', v));
  </script>
</html>
