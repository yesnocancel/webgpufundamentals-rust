<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>WebGPU Blend</title>
    <style>
      @import url(resources/webgpu-lesson.css);
html, body {
  margin: 0;       /* remove the default margin          */
  height: 100%;    /* make the html,body fill the page   */
}
canvas {
  display: block;  /* make the canvas act like a block   */
  width: 100%;     /* make the canvas fill its container */
  height: 100%;
}
canvas {
  background-color: #404040;
  background-image:
     linear-gradient(45deg, #808080 25%, transparent 25%),
     linear-gradient(-45deg, #808080 25%, transparent 25%),
     linear-gradient(45deg, transparent 75%, #808080 75%),
     linear-gradient(-45deg, transparent 75%, #808080 75%);
  background-size: 32px 32px;
  background-position: 0 0, 0 16px, 16px -16px, -16px 0px;
}
    </style>
  </head>
  <body>
    <canvas></canvas>
  </body>
  <script type="module">
import GUI from '../3rdparty/muigui-0.x.module.js';
import init, * as wasm from './wasm/webgpu-blend/webgpu-blend.js';
await init();

const operations = [
  'add',
  'subtract',
  'reverse-subtract',
  'min',
  'max',
];

const factors = [
  'zero',
  'one',
  'src',
  'one-minus-src',
  'src-alpha',
  'one-minus-src-alpha',
  'dst',
  'one-minus-dst',
  'dst-alpha',
  'one-minus-dst-alpha',
  'src-alpha-saturated',
  'constant',
  'one-minus-constant',
];

const presets = {
  'default (copy)': {
    color: {
      operation: 'add',
      srcFactor: 'one',
      dstFactor: 'zero',
    },
  },
  'premultiplied blend (source-over)': {
    color: {
      operation: 'add',
      srcFactor: 'one',
      dstFactor: 'one-minus-src-alpha',
    },
  },
  'un-premultiplied blend': {
    color: {
      operation: 'add',
      srcFactor: 'src-alpha',
      dstFactor: 'one-minus-src-alpha',
    },
  },
  'destination-over': {
    color: {
      operation: 'add',
      srcFactor: 'one-minus-dst-alpha',
      dstFactor: 'one',
    },
  },
  'source-in': {
    color: {
      operation: 'add',
      srcFactor: 'dst-alpha',
      dstFactor: 'zero',
    },
  },
  'destination-in': {
    color: {
      operation: 'add',
      srcFactor: 'zero',
      dstFactor: 'src-alpha',
    },
  },
  'source-out': {
    color: {
      operation: 'add',
      srcFactor: 'one-minus-dst-alpha',
      dstFactor: 'zero',
    },
  },
  'destination-out': {
    color: {
      operation: 'add',
      srcFactor: 'zero',
      dstFactor: 'one-minus-src-alpha',
    },
  },
  'source-atop': {
    color: {
      operation: 'add',
      srcFactor: 'dst-alpha',
      dstFactor: 'one-minus-src-alpha',
    },
  },
  'destination-atop': {
    color: {
      operation: 'add',
      srcFactor: 'one-minus-dst-alpha',
      dstFactor: 'src-alpha',
    },
  },
  'additive (lighten)': {
    color: {
      operation: 'add',
      srcFactor: 'one',
      dstFactor: 'one',
    },
  },
};

const color = {
  operation: 'add',
  srcFactor: 'one',
  dstFactor: 'one-minus-src',
};

const alpha = {
  operation: 'add',
  srcFactor: 'one',
  dstFactor: 'one-minus-src',
};

const constant = {
  color: [1, 0.5, 0.25],
  alpha: 1,
};

const clear = {
  color: [0, 0, 0],
  alpha: 0,
  premultiply: true,
};

const settings = {
  alphaMode: 'premultiplied',
  textureSet: 0,
  preset: 'default (copy)',
};

function makeBlendComponentValid(blend) {
  const { operation } = blend;
  if (operation === 'min' || operation === 'max') {
    blend.srcFactor = 'one';
    blend.dstFactor = 'one';
  }
}

// send the current settings to the wasm module (which re-renders).
// only the ones that changed to avoid needless re-renders.
const sent = {};
function set(kind, name, value) {
  if (sent[name] !== value) {
    sent[name] = value;
    wasm[`set_setting_${kind}`](name, value);
  }
}

function update() {
  makeBlendComponentValid(color);
  makeBlendComponentValid(alpha);
  gui.updateDisplay();

  set('str', 'alphaMode', settings.alphaMode);
  set('num', 'textureSet', settings.textureSet);
  set('str', 'colorOperation', color.operation);
  set('str', 'colorSrcFactor', color.srcFactor);
  set('str', 'colorDstFactor', color.dstFactor);
  set('str', 'alphaOperation', alpha.operation);
  set('str', 'alphaSrcFactor', alpha.srcFactor);
  set('str', 'alphaDstFactor', alpha.dstFactor);
  set('num', 'constantColor0', constant.color[0]);
  set('num', 'constantColor1', constant.color[1]);
  set('num', 'constantColor2', constant.color[2]);
  set('num', 'constantAlpha', constant.alpha);
  set('bool', 'clearPremultiply', clear.premultiply);
  set('num', 'clearAlpha', clear.alpha);
  set('num', 'clearColor0', clear.color[0]);
  set('num', 'clearColor1', clear.color[1]);
  set('num', 'clearColor2', clear.color[2]);
}

const gui = new GUI().onChange(update);
gui.add(settings, 'alphaMode', ['opaque', 'premultiplied']).name('canvas alphaMode');
gui.add(settings, 'textureSet', ['premultiplied alpha', 'un-premultiplied alpha']);
gui.add(settings, 'preset', Object.keys(presets))
  .name('blending preset')
  .onChange(presetName => {
    const preset = presets[presetName];
    Object.assign(color, preset.color);
    Object.assign(alpha, preset.alpha || preset.color);
    gui.updateDisplay();
  });
const colorFolder = gui.addFolder('color');
colorFolder.add(color, 'operation', operations);
colorFolder.add(color, 'srcFactor', factors);
colorFolder.add(color, 'dstFactor', factors);
const alphaFolder = gui.addFolder('alpha');
alphaFolder.add(alpha, 'operation', operations);
alphaFolder.add(alpha, 'srcFactor', factors);
alphaFolder.add(alpha, 'dstFactor', factors);
const constantFolder = gui.addFolder('constant');
constantFolder.addColor(constant, 'color');
constantFolder.add(constant, 'alpha', 0, 1);
const clearFolder = gui.addFolder('clear color');
clearFolder.add(clear, 'premultiply');
clearFolder.add(clear, 'alpha', 0, 1);
clearFolder.addColor(clear, 'color');
  </script>
</html>
