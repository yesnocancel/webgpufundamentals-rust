<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>WebGPU Simple Textured Quad - Import Image</title>
    <style>
      @import url(resources/webgpu-lesson.css);
html, body {
  margin: 0;       /* remove the default margin          */
  height: 100%;    /* make the html,body fill the page   */
}
canvas {
  display: block;  /* make the canvas act like a block   */
  width: 100%;     /* make the canvas fill its container */
  height: 100%;
}
#msg {
  position: fixed;
  top: 40%;
  left: 0;
  font-size: 3vh;
  padding: 0.5em;
  color: white;
  background-color: black;
  pointer-events: none;
  user-select: none;
}
    </style>
  </head>
  <body>
    <canvas></canvas>
    <pre id="msg">click to
switch 
textures</pre>
  </body>
    <script type="module">
import init, * as wasm from './wasm/webgpu-simple-textured-quad-import/webgpu-simple-textured-quad-import.js';
await init();

let texNdx = 0;
const kNumTextures = 3;
document.querySelector('canvas').addEventListener('click', () => {
  texNdx = (texNdx + 1) % kNumTextures;
  wasm.set_setting_num('texNdx', texNdx);
});
  </script>
</html>
