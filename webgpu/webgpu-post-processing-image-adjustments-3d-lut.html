<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>WebGPU Post Processing - Step 8 - 3D-LUT</title>
    <style>
      @import url(resources/webgpu-lesson.css);
html, body {
  margin: 0;       /* remove the default margin          */
  height: 100%;    /* make the html,body fill the page   */
}
canvas {
  display: block;  /* make the canvas act like a block   */
  width: 100%;     /* make the canvas fill its container */
  height: 100%;
}
    </style>
  </head>
  <body>
    <canvas></canvas>
  </body>
    <script type="module">
import GUI from '../3rdparty/muigui-0.x.module.js';
import init, * as wasm from './wasm/webgpu-post-processing-image-adjustments-3d-lut/webgpu-post-processing-image-adjustments-3d-lut.js';
await init();

// must match the lut_bind_groups order in the Rust example
const lutNames = [
  'identity',
  'identity (nearest)',
];

const settings = {
  lutAmount: 1,
  lut: 0,
};

const gui = new GUI();
gui.add(settings, 'lutAmount', 0, 1)
   .onChange(v => wasm.set_setting_num('lutAmount', v));
const keyValues = Object.fromEntries(lutNames.map((name, i) => [name, i]));
gui.add(settings, 'lut', { keyValues })
   .onChange(v => wasm.set_setting_num('lut', v));
  </script>
</html>
