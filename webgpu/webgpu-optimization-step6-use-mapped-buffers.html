<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>WebGPU Optimization - Use Mapped Buffers</title>
    <style>
      @import url(resources/webgpu-lesson.css);
html, body {
  margin: 0;       /* remove the default margin          */
  height: 100%;    /* make the html,body fill the page   */
}
canvas {
  display: block;  /* make the canvas act like a block   */
  width: 100%;     /* make the canvas fill its container */
  height: 100%;
}
:root {
  --bg-color: #fff;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg-color: #000;
  }
}
canvas {
  background-color: var(--bg-color);
}
#info {
  position: absolute;
  left: 0;
  top: 0;
  padding: 0.5em;
  margin: 0;
  background-color: rgba(0, 0, 0, 0.8);
  color: white;
  min-width: 8em;
}
    </style>
  </head>
  <body>
    <canvas></canvas>
    <pre id="info"></pre>
  </body>
  <script type="module">
import GUI from '../3rdparty/muigui-0.x.module.js';
import init, * as wasm from './wasm/webgpu-optimization-step6-use-mapped-buffers/webgpu-optimization-step6-use-mapped-buffers.js';
await init();

const maxObjects = 30000;

const settings = {
  numObjects: 1000,
  render: true,
};

const gui = new GUI();
gui.add(settings, 'numObjects', { min: 0, max: maxObjects, step: 1})
  .onChange(v => wasm.set_setting_num('numObjects', v));
gui.add(settings, 'render')
  .onChange(v => wasm.set_setting_bool('render', v));
  </script>
</html>
