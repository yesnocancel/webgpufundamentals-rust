<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>WebGPU Cameras - Camera Aim - Step 2</title>
    <style>
      @import url(resources/webgpu-lesson.css);
html, body {
  margin: 0;       /* remove the default margin          */
  height: 100%;    /* make the html,body fill the page   */
}
canvas {
  display: block;  /* make the canvas act like a block   */
  width: 100%;     /* make the canvas fill its container */
  height: 100%;
}
:root {
  --bg-color: #fff;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg-color: #000;
  }
}
canvas {
  background-color: var(--bg-color);
}
    </style>
  </head>
  <body>
    <canvas></canvas>
  </body>
    <script type="module">
import GUI from '../3rdparty/muigui-0.x.module.js';
import init, * as wasm from './wasm/webgpu-cameras-step-2-camera-aim/webgpu-cameras-step-2-camera-aim.js';
await init();

const degToRad = d => d * Math.PI / 180;

const settings = {
  fieldOfView: degToRad(100),
  cameraAngle: 0,
};

const radToDegOptions = { min: -360, max: 360, step: 1, converters: GUI.converters.radToDeg };

const gui = new GUI();
gui.add(settings, 'fieldOfView', {min: 1, max: 179, converters: GUI.converters.radToDeg})
   .onChange(v => wasm.set_setting_num('fieldOfView', v));
gui.add(settings, 'cameraAngle', radToDegOptions)
   .onChange(v => wasm.set_setting_num('cameraAngle', v));
  </script>
</html>
