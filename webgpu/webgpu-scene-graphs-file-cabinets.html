<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>WebGPU Scene Graph - File Cabinets</title>
    <style>
      @import url(resources/webgpu-lesson.css);
html, body {
  margin: 0;       /* remove the default margin          */
  height: 100%;    /* make the html,body fill the page   */
}
canvas {
  display: block;  /* make the canvas act like a block   */
  width: 100%;     /* make the canvas fill its container */
  height: 100%;
}
:root {
  --bg-color: #fff;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg-color: #000;
  }
}
canvas {
  background-color: var(--bg-color);
}
    </style>
  </head>
  <body>
    <canvas></canvas>
  </body>
  <script type="module">
import GUI from '../3rdparty/muigui-0.x.module.js';
import init, * as wasm from './wasm/webgpu-scene-graphs-file-cabinets/webgpu-scene-graphs-file-cabinets.js';
await init();

const settings = {
  cameraRotation: 0,
};

const radToDegOptions = { min: -180, max: 180, step: 1, converters: GUI.converters.radToDeg };

const gui = new GUI();
gui.add(settings, 'cameraRotation', radToDegOptions)
   .onChange(v => wasm.set_setting_num('cameraRotation', v));
  </script>
</html>
