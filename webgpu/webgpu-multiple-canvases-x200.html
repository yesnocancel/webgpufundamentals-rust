<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>WebGPU Multiple Canvases - 200</title>
    <style>
      @import url(resources/webgpu-lesson.css);
      .product {
        display: inline-block;
        padding: 1em;
        background: #888;
        margin: 1em;
      }
      .size0>canvas {
        width: 200px;
        height: 200px;
      }
      .size1>canvas {
        width: 250px;
        height: 200px;
      }
      .size2>canvas {
        width: 300px;
        height: 200px;
      }
      .size3>canvas {
        width: 100px;
        height: 200px;
      }
      #stop {
        position: fixed;
        right: 0;
        top: 0;
        margin: 0.5em;
        z-index: 1;
      }
    </style>
  </head>
  <body>
    <button type="button" id="stop">Stop/Start</button>
  </body>
  <script type="module">
import init, * as wasm from './wasm/webgpu-multiple-canvases-x200/webgpu-multiple-canvases-x200.js';

// Make the 200 product cards (plain DOM work, so it stays in page JS —
// the wasm module then finds and renders every <canvas>).
const numProducts = 200;
for (let i = 0; i < numProducts; ++i) {
  // making this
  // <div class="product size?">
  //   <canvas></canvas>
  //   <div>Product#: ?</div>
  // </div>
  const canvas = document.createElement('canvas');

  const container = document.createElement('div');
  container.className = `product size${i % 4}`;

  const description = document.createElement('div');
  description.textContent = `product#: ${i + 1}`;

  container.appendChild(canvas);
  container.appendChild(description);
  document.body.appendChild(container);
}

await init();

let running = true;
document.querySelector('#stop').addEventListener('click', () => {
  running = !running;
  wasm.set_setting_bool('running', running);
});
  </script>
</html>
