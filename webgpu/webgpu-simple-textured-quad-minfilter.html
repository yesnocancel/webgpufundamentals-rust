<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>WebGPU Simple Textured Quad MinFilter</title>
    <style>
      @import url(resources/webgpu-lesson.css);
html, body {
  margin: 0;       /* remove the default margin          */
  height: 100%;    /* make the html,body fill the page   */
}
canvas {
  display: block;  /* make the canvas act like a block   */
  width: 100%;     /* make the canvas fill its container */
  height: 100%;
  image-rendering: pixelated;
  image-rendering: crisp-edges;
}
    </style>
  </head>
  <body>
    <canvas></canvas>
  </body>
  <script type="module">
import GUI from '../3rdparty/muigui-0.x.module.js';
import init, * as wasm from './wasm/webgpu-simple-textured-quad-minfilter/webgpu-simple-textured-quad-minfilter.js';

await init();

const settings = {
  addressModeU: 'repeat',
  addressModeV: 'repeat',
  magFilter: 'linear',
  minFilter: 'linear',
};

const addressOptions = ['repeat', 'clamp-to-edge'];
const filterOptions = ['nearest', 'linear'];

const gui = new GUI();
Object.assign(gui.domElement.style, {right: '', left: '15px'});
gui.add(settings, 'addressModeU', addressOptions)
  .onChange(v => wasm.set_setting_str('addressModeU', v));
gui.add(settings, 'addressModeV', addressOptions)
  .onChange(v => wasm.set_setting_str('addressModeV', v));
gui.add(settings, 'magFilter', filterOptions)
  .onChange(v => wasm.set_setting_str('magFilter', v));
gui.add(settings, 'minFilter', filterOptions)
  .onChange(v => wasm.set_setting_str('minFilter', v));
  </script>
</html>
