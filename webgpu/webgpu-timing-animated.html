<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>WebGPU Timing - Step 1 - Animated</title>
    <style>
      @import url(resources/webgpu-lesson.css);
html, body {
  margin: 0;       /* remove the default margin          */
  height: 100%;    /* make the html,body fill the page   */
}
canvas {
  display: block;  /* make the canvas act like a block   */
  width: 100%;     /* make the canvas fill its container */
  height: 100%;
}
    </style>
  </head>
  <body>
    <canvas></canvas>
  </body>
  <script type="module">
import GUI from '../3rdparty/muigui-0.x.module.js';
import init, * as wasm from './wasm/webgpu-timing-animated/webgpu-timing-animated.js';
await init();

const kNumObjects = 10000;

const settings = {
  numObjects: 100,
};

const gui = new GUI();
gui.add(settings, 'numObjects', 0, kNumObjects, 1)
  .onChange(v => wasm.set_setting_num('numObjects', v));
  </script>
</html>
