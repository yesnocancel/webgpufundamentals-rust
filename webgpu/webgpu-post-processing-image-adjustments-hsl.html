<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>WebGPU Post Processing - Step 4 - HSL</title>
    <style>
      @import url(resources/webgpu-lesson.css);
html, body {
  margin: 0;       /* remove the default margin          */
  height: 100%;    /* make the html,body fill the page   */
}
canvas {
  display: block;  /* make the canvas act like a block   */
  width: 100%;     /* make the canvas fill its container */
  height: 100%;
}
    </style>
  </head>
  <body>
    <canvas></canvas>
  </body>
    <script type="module">
import GUI from '../3rdparty/muigui-0.x.module.js';
import init, * as wasm from './wasm/webgpu-post-processing-image-adjustments-hsl/webgpu-post-processing-image-adjustments-hsl.js';
await init();

const settings = {
  brightness: 0,
  contrast: 0,
  hue: 0,
  saturation: 0,
  lightness: 0,
};

const gui = new GUI();
gui.add(settings, 'brightness', -1, 1)
   .onChange(v => wasm.set_setting_num('brightness', v));
gui.add(settings, 'contrast', -1, 10)
   .onChange(v => wasm.set_setting_num('contrast', v));
gui.add(settings, 'hue', -0.5, 0.5)
   .onChange(v => wasm.set_setting_num('hue', v));
gui.add(settings, 'saturation', -1, 1)
   .onChange(v => wasm.set_setting_num('saturation', v));
gui.add(settings, 'lightness', -1, 1)
   .onChange(v => wasm.set_setting_num('lightness', v));
  </script>
</html>
