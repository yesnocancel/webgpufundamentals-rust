[workspace]
resolver = "2"
members = [
    "wgpu_fun",
    "examples",
]

[workspace.package]
edition = "2021"
license = "MIT"

[workspace.dependencies]
wgpu = "30"
winit = "0.30"
pollster = "1"
bytemuck = { version = "1", features = ["derive"] }
glam = "0.33"
env_logger = "0.11"
futures-channel = "0.3"
log = "0.4"
png = "0.18"
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
wasm-bindgen = "0.2"
js-sys = "0.3"
wasm-bindgen-futures = "0.4"
web-sys = "0.3"
console_error_panic_hook = "0.1"
console_log = "1"

[profile.release]
opt-level = "s"
